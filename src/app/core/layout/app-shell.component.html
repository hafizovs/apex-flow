<div
  class="afx-shell"
  [class.afx-shell--nav-open]="ui.mobileNavOpen()"
  [attr.data-theme]="ui.theme()"
>
  @if (ui.mobileNavOpen()) {
    <button
      type="button"
      class="afx-shell__nav-backdrop"
      [attr.aria-label]="t('nav.closeMenu')"
      (click)="closeMobileNav()"
    ></button>
  }
  <afx-sidebar />
  <div class="afx-shell__main">
    <afx-topbar />
    <main class="afx-shell__outlet">
      <router-outlet />
    </main>
  </div>
  <afx-toast />
  @if (ui.helpOpen()) {
    <afx-help-drawer />
  }
</div>
